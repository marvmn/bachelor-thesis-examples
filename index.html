<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scenario Video Comparison</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>xRomotion Examples</h1>

  <div class="scenario-list">
    <div class="scenario">
      <button class="toggle">Jitter Effect</button>
      <div class="content">
        <div class="video-pair">
          <video controls>
            <source src="videos/BA-Scenario-Handover-E-Cut.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          <video controls>
            <source src="videos/BA-Scenario-Handover-F-Cut.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>
    </div>

    <div class="scenario">
      <button class="toggle">Scenario 2</button>
      <div class="content">
        <div class="video-pair">
          <video controls>
            <source src="videos/scenario2_versionA.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          <video controls>
            <source src="videos/scenario2_versionB.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>
    </div>

    <!-- Add more scenarios as needed -->
  </div>

  <script src="script.js"></script>
</body>
</html>
